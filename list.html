<!DOCTYPE html>
<html>
<head>
    <title>List Books</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            color: #fff;
            position: relative;
            min-height: 100vh;
        }
        /* Background image with blur */
        body::before {
            content: "";
            background: url('BCO.476c8cfe-a449-4ee1-98ec-fe266515077a.png') no-repeat center center fixed;
            background-size: cover;
            filter: blur(6px);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        h1 {
            color: #ffcc00;
            margin-top: 20px;
        }
        hr {
            border: 1px solid #ffcc00;
        }
        a {
            color: #00ffcc;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
            font-size: 18px;
            background-color: rgba(0,0,0,0.6);
            padding: 5px 10px;
            border-radius: 4px;
        }
        a:hover {
            color: #ff6699;
            background-color: rgba(255,255,255,0.2);
            box-shadow: 0 0 10px #ff6699;
        }
        button {
            background-color: #ff6699;
            color: #fff;
            border: none;
            padding: 12px 25px;
            margin: 10px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #00cc99;
            box-shadow: 0 0 12px #00cc99;
        }
        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 90%;
            background-color: rgba(0,0,0,0.6);
            color: #fff;
        }
        th, td {
            border: 1px solid #ffcc00;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #333;
            color: #ffcc00;
        }
        tr:hover {
            background-color: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <h1>LIST OF BOOKS</h1>
    <hr>
    <a href="index.html">Home</a> |
    <a href="list.html">List Books</a> |
    <a href="listOne.html">List Required Book</a> |
    <a href="insert.html">Insert Book</a> |
    <a href="update.html">Update Book</a> |
    <a href="delete.html">Delete Book</a>
    <hr>

    <button onclick="loadBooks()">Refresh List</button>
    <br><br>

    <table id="bookTable"></table>
    <br>
    <button onclick="location.href='index.html'">Home Page</button>

    <script>
        loadBooks();
        function loadBooks() {
            fetch("/books")
            .then(response => response.json())
            .then(data => {
                let table = document.getElementById("bookTable");
                table.innerHTML = `
                <tr>
                    <th>Book ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                </tr>`;
                data.forEach(book => {
                    table.innerHTML += `
                    <tr>
                        <td>${book.book_id}</td>
                        <td>${book.book_title}</td>
                        <td>${book.book_author}</td>
                        <td>${book.book_category}</td>
                        <td>${book.book_price}</td>
                        <td>${book.book_stock}</td>
                    </tr>`;
                });
            });
        }
    </script>
</body>
</html>
