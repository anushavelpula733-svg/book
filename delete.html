<!DOCTYPE html>
<html>
<head>
    <title>Delete Book</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            color: #fff;
            position: relative;
            min-height: 100vh;
        }
        /* Background image with blur */
        body::before {
            content: "";
            background: url('BCO.476c8cfe-a449-4ee1-98ec-fe266515077a.png') no-repeat center center fixed;
            background-size: cover;
            filter: blur(6px);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        h1 {
            color: #ffcc00;
            margin-top: 20px;
        }
        hr {
            border: 1px solid #ffcc00;
        }
        a {
            color: #00ffcc;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
            font-size: 18px;
            background-color: rgba(0,0,0,0.6);
            padding: 5px 10px;
            border-radius: 4px;
        }
        a:hover {
            color: #ff6699;
            background-color: rgba(255,255,255,0.2);
            box-shadow: 0 0 10px #ff6699;
        }
        select {
            padding: 10px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
            margin: 10px;
            background-color: #222;
            color: #fff;
            width: 250px;
        }
        button {
            background-color: #ff6699;
            color: #fff;
            border: none;
            padding: 12px 25px;
            margin: 10px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #00cc99;
            box-shadow: 0 0 12px #00cc99;
        }
    </style>
</head>
<body>
    <h1>DELETE BOOK</h1>
    <hr>
    <a href="index.html">Home</a> |
    <a href="list.html">List Books</a> |
    <a href="listOne.html">List Required Book</a> |
    <a href="insert.html">Insert Book</a> |
    <a href="update.html">Update Book</a> |
    <a href="delete.html">Delete Book</a>
    <hr>

    Book ID to Delete:
    <select id="bookDropdown">
        <option value="">-- Select Book ID --</option>
    </select>
    <br><br>

    <button onclick="deleteBook()">Delete</button>
    <br><br>
    <button onclick="location.href='index.html'">Home Page</button>

    <script>
        // Load dropdown with only book IDs
        async function loadBooks() {
            try {
                const response = await fetch("/books");
                const books = await response.json();

                const idDropdown = document.getElementById("bookDropdown");

                books.forEach(book => {
                    let idOption = document.createElement("option");
                    idOption.value = book.book_id;
                    idOption.textContent = book.book_id; // only ID shown
                    idDropdown.appendChild(idOption);
                });
            } catch (error) {
                alert("Error loading books: " + error.message);
            }
        }

        function deleteBook() {
            let bookId = document.getElementById("bookDropdown").value;

            if (!bookId) {
                alert("Please select a book ID.");
                return;
            }

            if (confirm("Are you sure you want to delete this book?") == false)
                return;

            fetch("/books/" + bookId, {
                method: "DELETE"
            })
            .then(response => {
                if (response.ok) return response.text();
                return response.text().then(message => { throw new Error(message); });
            })
            .then(message => {
                alert(message);
                location.href = "index.html";
            })
            .catch(error => {
                alert(error.message);
            });
        }

        // Load books when page opens
        window.onload = loadBooks;
    </script>
</body>
</html>
