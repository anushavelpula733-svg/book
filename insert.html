<!-- To insert book data -->
<!DOCTYPE html>
<html>
<head>
    <title>Insert Book</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            color: #fff;
            position: relative;
            min-height: 100vh;
        }
        /* Background image with blur */
        body::before {
            content: "";
            background: url('BCO.476c8cfe-a449-4ee1-98ec-fe266515077a.png') no-repeat center center fixed;
            background-size: cover;
            filter: blur(6px);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        h1 {
            color: #ffcc00;
            margin-top: 20px;
        }
        hr {
            border: 1px solid #ffcc00;
        }
        a {
            color: #00ffcc;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
            font-size: 18px;
            background-color: rgba(0,0,0,0.6);
            padding: 5px 10px;
            border-radius: 4px;
        }
        a:hover {
            color: #ff6699;
            background-color: rgba(255,255,255,0.2);
            box-shadow: 0 0 10px #ff6699;
        }
        input {
            padding: 10px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
            margin: 10px;
            background-color: #222;
            color: #fff;
            width: 250px;
        }
        button {
            background-color: #ff6699;
            color: #fff;
            border: none;
            padding: 12px 25px;
            margin: 10px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #00cc99;
            box-shadow: 0 0 12px #00cc99;
        }
    </style>
</head>
<body>
    <h1>INSERT BOOK</h1>
    <hr>
    <a href="index.html">Home</a> |
    <a href="list.html">List Books</a> |
    <a href="listOne.html">List Required Book</a> |
    <a href="insert.html">Insert Book</a> |
    <a href="update.html">Update Book</a> |
    <a href="delete.html">Delete Book</a>
    <hr>

    Book ID:
    <input type="number" id="book_id">
    <br><br>
    Book Title:
    <input type="text" id="book_title">
    <br><br>
    Book Author:
    <input type="text" id="book_author">
    <br><br>
    Book Category:
    <input type="text" id="book_category">
    <br><br>
    Book Price:
    <input type="number" step="0.01" id="book_price">
    <br><br>
    Book Stock:
    <input type="number" id="book_stock">
    <br><br>

    <button onclick="saveBook()">Save</button>
    <br><br>
    <button onclick="location.href='index.html'">Home Page</button>

    <script>
        function saveBook() {
            let book_id = document.getElementById("book_id").value;
            let book_title = document.getElementById("book_title").value;
            let book_author = document.getElementById("book_author").value;
            let book_category = document.getElementById("book_category").value;
            let book_price = document.getElementById("book_price").value;
            let book_stock = document.getElementById("book_stock").value;

            fetch("/books", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    book_id, 
                    book_title, 
                    book_author, 
                    book_category, 
                    book_price, 
                    book_stock 
                })
            })
            .then(response => response.text())
            .then(message => {
                alert(message);
                location.href = "index.html";
            })
            .catch(error => {
                alert("Error: " + error.message);
            });
        }
    </script>
</body>
</html>
